name: CI

on:
  push:
    branches: [main, 'codex/release-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install uv==0.12.3
          uv pip install --system --torch-backend=cpu -e .[dev]
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install FFmpeg for render integration tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Prepare Windows renderer
        if: runner.os == 'Windows'
        run: python -m autocaption.bootstrap --prepare
      - name: Prepare macOS renderer
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Test
        run: pytest -q
      - name: Build and audit distributable
        if: runner.os == 'Windows' && matrix.python == '3.11'
        run: python scripts/build_release.py
