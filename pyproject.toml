[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "autocaption"
version = "1.3.0"
description = "Free local karaoke-style auto captions for shorts/reels (Whisper + ASS + FFmpeg)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sergio Betancur Chaves" }]
maintainers = [{ name = "Dvir Cabessa" }]
requires-python = ">=3.10,<3.14"
keywords = [
    "captions", "subtitles", "karaoke", "whisper", "ffmpeg",
    "shorts", "tiktok", "reels", "video-editing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "faster-whisper>=1.0.0",
    "customtkinter>=5.2.0",
    "tkinterdnd2>=0.4.0",
    "whisperx==3.8.5",
    "Pillow>=10",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "python-multipart>=0.0.20",
    "psutil>=6,<8",
]

[project.optional-dependencies]
dev = ["pytest", "fonttools", "httpx"]
precision = ["uroman==1.3.1.1", "phonikud==0.4.1; python_version < '3.13'", "phonikud-onnx==1.0.6; python_version < '3.13'"]

[project.urls]
Homepage = "https://github.com/dvicabi/katuv"
Repository = "https://github.com/dvicabi/katuv"
Issues = "https://github.com/dvicabi/katuv/issues"

[project.scripts]
autocaption = "autocaption.cli:main"
autocaption-web = "autocaption.web:main"

[project.gui-scripts]
autocaption-gui = "autocaption.gui:main"

[tool.setuptools]
packages = ["autocaption"]

[tool.setuptools.package-data]
autocaption = ["fonts/*", "web_static/*", "assets/*"]
